# ===== Application =====
spring.application.name=CeylonGo Backend
server.port=8080

# ===== MySQL Database =====
# Update username/password to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/ceylongo?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=CeylonGo@SLIIT@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" is fine for development. The team also provides database/schema
# and database/seed SQL files if you prefer to create the schema manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# 256-bit+ secret required for HS256. Change this for production.
app.jwt.secret=ceylonGoSuperSecretKeyForJwtSigningChangeThisInProduction123456
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173

# ===== File upload (destination/guide images stored as URLs, not binary, for simplicity) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
